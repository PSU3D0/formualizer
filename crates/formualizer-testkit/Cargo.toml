[package]
name = "formualizer-testkit"
version = "0.1.0"
edition = "2024"
description = "Reusable test and fixture helpers for Formualizer crates"
homepage.workspace = true
license.workspace = true
repository.workspace = true
documentation.workspace = true
publish = false

[features]
# xlsx fixture helpers (umya-backed). Default-on; disable for dependents that
# only need the pure generators (e.g. formualizer-eval dev-deps).
default = ["xlsx"]
xlsx = ["dep:umya-spreadsheet", "dep:tempfile", "dep:zip"]
workbook = [
    "dep:formualizer-workbook",
    "dep:formualizer-common",
    "dep:formualizer-eval",
    "dep:formualizer-parse",
    "dep:tracing",
    "dep:tracing-subscriber",
    "formualizer-eval/tracing",
    "formualizer-workbook/calamine",
    "formualizer-workbook/umya",
]

[dependencies]
tempfile = { workspace = true, optional = true }
umya-spreadsheet = { version = "=2.3.2", optional = true }
zip = { version = "7.2", default-features = false, features = ["deflate"], optional = true }
formualizer-workbook = { version = "0.10.1", path = "../formualizer-workbook", default-features = false, optional = true }
formualizer-common = { workspace = true, optional = true }
formualizer-eval = { version = "0.10.1", path = "../formualizer-eval", default-features = false, optional = true }
formualizer-parse = { workspace = true, optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }

[dev-dependencies]
libtest-mimic = "0.8"

[[test]]
name = "scenarios"
path = "tests/scenarios.rs"
harness = false
required-features = ["workbook", "xlsx"]

[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
quote = "1.0"
regex = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
syn = { version = "2.0", features = ["full", "visit"] }
walkdir = "2.5"
formualizer-eval = { path = "../formualizer-eval" }
formualizer-common = { path = "../formualizer-common" }
formualizer-parse = { path = "../formualizer-parse" }
formualizer-workbook = { path = "../formualizer-workbook", default-features = false, features = ["system-clock"] }
serde_yaml = "0.9"
chrono = { workspace = true, features = ["clock"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = { workspace = true }

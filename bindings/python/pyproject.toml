[build-system]
requires = ["maturin>=1.11,<2.0"]
build-backend = "maturin"

[project]
name = "formualizer"
version = "0.8.4"
description = "Embeddable spreadsheet engine — parse, evaluate & mutate Excel workbooks at native speed"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["spreadsheet", "excel", "formula", "evaluation", "parser", "arrow"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.urls]
Homepage = "https://github.com/PSU3D0/formualizer"
Documentation = "https://docs.rs/formualizer"
Repository = "https://github.com/PSU3D0/formualizer"
"Bug Tracker" = "https://github.com/PSU3D0/formualizer/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    # A deadlock regression must fail the suite, not hang the runner: the GIL
    # deadlock fixed in #327 produced a test that ran >180s with no output.
    "pytest-timeout>=2.3",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "openpyxl"
]

[tool.maturin]
# Keep Rust crate/module named `formualizer_py`, but install it under the
# public Python package `formualizer` to avoid top-level module conflicts.
module-name = "formualizer.formualizer_py"
# Mark as mixed Rust/Python layout. The stub generator promotes native-module
# declarations to the public package and writes a companion native-module stub.
python-source = "."
features = ["pyo3/extension-module", "pyo3/abi3-py310"]

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    # Generated by `cargo run --bin stub_gen`
    "formualizer/__init__.pyi",
    "formualizer/formualizer_py.pyi",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
]
ignore = [
    "E501",  # line too long, handled by formatter
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "SIM105",
    "F401",
    "F403",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.isort]
known-first-party = ["formualizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Two independent bounds, because they fail in different situations.
#
# `faulthandler_timeout` is the one that matters for this extension. pytest
# arms it with `faulthandler.dump_traceback_later(..., exit=True)`, whose
# watchdog is a *native* thread that never takes the GIL, so it still fires
# when the interpreter is fully deadlocked (the GIL holder blocked in native
# code while native threads wait for the GIL - the #327 bug). It dumps every
# thread's stack and kills the process. MEASURED: neither pytest-timeout's
# "thread" nor its "signal" method fires in that state, because both need to
# execute Python.
faulthandler_timeout = 60
# Dumping alone is not enough: without this pytest passes `exit=False` and the
# deadlocked process keeps running until the CI job's own limit. MEASURED.
faulthandler_exit_on_timeout = true
# pytest-timeout gives per-test bounds and a proper failure report for hangs
# that *are* interruptible (a pure-Python loop, a stuck socket). Tests bound
# themselves more tightly with @pytest.mark.timeout(...).
timeout = 300
addopts = [
    "--strict-markers",
    "--strict-config",
    "--cov=formualizer",
    "--cov-report=term-missing",
    "--cov-report=html",
    "--cov-report=xml",
]

[tool.coverage.run]
source = ["formualizer"]
omit = [
    "*/tests/*",
    "*/test_*.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["formualizer.formualizer_py"]
ignore_missing_imports = true

[dependency-groups]
dev = [
    "openpyxl>=3.1.5",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3",
]

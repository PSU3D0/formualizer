# pnpm 11 fails installs whose dependency build scripts are neither allowed nor
# denied. Neither script is needed: esbuild ships its binary as an optional
# platform package, and sharp is unused because the static export serves
# unoptimized images.
allowBuilds:
  esbuild: false
  sharp: false

# Tailwind pins an older PostCSS patch; keep every build-time copy on the
# patched 8.5 line as well as the direct dependency. Verified by the static build.
overrides:
  postcss: ^8.5.31

name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reuse-pr-checks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/reuse-pr-checks.yml
    permissions:
      actions: read
      contents: read
      pull-requests: read
    with:
      workflow-file: ci.yml

  test-python:
    needs: reuse-pr-checks
    if: ${{ !cancelled() && needs.reuse-pr-checks.outputs.reuse != 'true' }}
    uses: ./.github/workflows/python-checks.yml

  test-rust:
    needs: reuse-pr-checks
    if: ${{ !cancelled() && needs.reuse-pr-checks.outputs.reuse != 'true' }}
    # Keep Python and WASM binding crates out of the core Rust pass. They are
    # covered by test-python and the WASM workflow, and pulling them in here
    # needlessly compiles PyO3/wasm-bindgen twice.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Workbook test binaries statically link Wasmtime; full debug info can
      # exhaust runner disk. Keep file/line information for panic backtraces.
      CARGO_PROFILE_DEV_DEBUG: line-tables-only
      CARGO_PROFILE_TEST_DEBUG: line-tables-only

    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.99.0
        components: rustfmt, clippy

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-test-line-tables-${{ hashFiles('**/Cargo.lock') }}

    - name: Check Rust formatting
      run: cargo fmt --all -- --check

    - name: Run Rust clippy
      run: >-
        cargo clippy --workspace
        --exclude formualizer-bench-core
        --exclude formualizer-python
        --exclude formualizer-wasm
        --all-targets --all-features -- -D warnings

    - name: Run Rust tests
      run: >-
        cargo test --workspace
        --exclude formualizer-bench-core
        --exclude formualizer-python
        --exclude formualizer-wasm
        --all-features

    - name: Run CFFI smoke test
      shell: bash
      run: |
        set -euo pipefail
        cargo run -p formualizer-cffi --bin cffi_smoke_setup
        cargo build -p formualizer-cffi
        cc crates/formualizer-cffi/tests/cffi_smoke.c \
          -I crates/formualizer-cffi/include \
          -L target/debug \
          -lformualizer_cffi \
          -Wl,-rpath,$PWD/target/debug \
          -o target/cffi_smoke
        target/cffi_smoke

    - name: Record tested source tree
      if: github.event_name == 'pull_request'
      continue-on-error: true
      uses: ./.github/actions/record-ci-tree

  public-api:
    needs: reuse-pr-checks
    if: ${{ !cancelled() && needs.reuse-pr-checks.outputs.reuse != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up pinned installer Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.93.0

    - name: Set up pinned rustdoc nightly
      uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      with:
        toolchain: nightly-2026-02-16
        targets: x86_64-unknown-linux-gnu

    - name: Cache public API tooling and build output
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          target/public-api-tools/
          target/public-api-cargo-home/
          target/public-api/
        key: ${{ runner.os }}-public-api-0.52.0-nightly-2026-02-16-${{ hashFiles('**/Cargo.lock', 'scripts/public-api.sh') }}
        restore-keys: |
          ${{ runner.os }}-public-api-0.52.0-nightly-2026-02-16-

    - name: Test CI automation and release preflight helpers
      run: |
        python3 .github/scripts/test_reuse_pr_checks.py
        python3 -m unittest scripts/tests/test_release_preflight.py

    - name: Verify public API tools
      run: scripts/public-api.sh setup

    - name: Check public Rust API snapshots
      run: scripts/public-api.sh check

    - name: Test concurrent snapshot updates
      run: scripts/tests/public-api-concurrency.sh

  build-wheels:
    needs: reuse-pr-checks
    if: ${{ !cancelled() && needs.reuse-pr-checks.outputs.reuse != 'true' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      matrix:
        os: [ubuntu-latest]
    
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.99.0

    - name: Build wheels
      uses: PyO3/maturin-action@v1
      with:
        # Avoid maturin-action's broken automatic range resolution on Node 24.
        maturin-version: v1.11.5
        rust-toolchain: 1.99.0
        working-directory: bindings/python
        # Build a single abi3 wheel (not one per Python interpreter)
        # In `act` (local CI), avoid nested manylinux Docker to keep things working.
        args: --release --out dist --interpreter ${{ env.ACT && 'python3' || '/opt/python/cp310-cp310/bin/python' }}
        manylinux: ${{ env.ACT && 'off' || 'manylinux2014' }}
        sccache: 'true'

    - name: Upload wheels
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: bindings/python/dist

  build-pyodide-wheel:
    needs: reuse-pr-checks
    if: ${{ !cancelled() && needs.reuse-pr-checks.outputs.reuse != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - uses: actions/checkout@v4

    # Host Python major.minor must match the xbuildenv's CPython (3.14 for
    # Pyodide 314.0.x) so maturin's sysconfig introspection can find the
    # emscripten sysconfigdata module. Don't downgrade this without also
    # changing bindings/python/scripts/build-pyodide-wheel.sh's pin.
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.14'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    # Provides rustup; the wheel itself is compiled with the Rust toolchain
    # pinned by the Pyodide xbuildenv (see build-pyodide-wheel.sh).
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      with:
        toolchain: 1.99.0

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
          target/
        key: ${{ runner.os }}-cargo-pyodide-${{ hashFiles('**/Cargo.lock') }}

    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.14'
        working-directory: bindings/python

    - name: Build Pyodide wheel
      working-directory: bindings/python
      run: ./scripts/build-pyodide-wheel.sh

    - name: Smoke-test Pyodide wheel
      working-directory: bindings/python
      run: |
        wheel="$(ls dist/pyodide/*_wasm32.whl | head -1)"
        if [[ -z "$wheel" ]]; then
          echo "No Pyodide wheel found in dist/pyodide" >&2
          exit 1
        fi
        ./scripts/smoke-pyodide-wheel.sh "$wheel"

    - name: Upload Pyodide wheel artifact
      if: ${{ !env.ACT }}
      uses: actions/upload-artifact@v4
      with:
        name: wheels-pyodide
        path: bindings/python/dist/pyodide
        if-no-files-found: error

name: Docs site

# Builds formualizer.dev (docs-site/, Next.js static export) on pull requests
# and deploys it to Cloudflare Workers static assets on pushes to main. The
# Recalc CLI pages include docs/cli.md, docs/agents.md, docs/cache-only-xlsx.md
# and skills/** at build time, so changes there rebuild the site too.

on:
  pull_request:
    paths:
      - docs-site/**
      - docs/cli.md
      - docs/agents.md
      - docs/cache-only-xlsx.md
      - skills/**
      - .github/workflows/docs-site.yml
  push:
    branches: [ main ]
    paths:
      - docs-site/**
      - docs/cli.md
      - docs/agents.md
      - docs/cache-only-xlsx.md
      - skills/**
      - .github/workflows/docs-site.yml
  workflow_dispatch:

permissions:
  contents: read

# Pull requests cancel superseded runs; main deploys queue and always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
          # History for the changed-file lint below.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # Corepack installs the pnpm version pinned by docs-site/package.json
      # (packageManager), matching pnpm-lock.yaml.
      - name: Enable pnpm
        run: |
          corepack enable
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build

      - name: Check export (includes, llms.txt, copied files)
        run: pnpm check:export

      # The site predates its Biome config and does not pass `pnpm lint` as a
      # whole yet, so CI holds the line on the files each change touches.
      - name: Lint changed files
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "${EVENT_NAME}" in
            pull_request) base="${PR_BASE}" ;;
            push) base="${PUSH_BEFORE}" ;;
            *) base="" ;;
          esac
          if [[ -z "${base}" || "${base}" =~ ^0+$ ]] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git merge-base origin/main HEAD)"
          fi
          mapfile -t files < <(git diff --name-only --relative --diff-filter=ACMR "${base}" HEAD -- .)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "No docs-site files changed since ${base}."
            exit 0
          fi
          printf 'Linting %s\n' "${files[@]}"
          pnpm exec biome check --no-errors-on-unmatched --files-ignore-unknown=true "${files[@]}"

      - name: Upload static export
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v6
        with:
          name: docs-site-out
          path: docs-site/out/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: build
    # Only pushes to main (or a manual run on main) in the upstream repository
    # deploy; forks and pull requests never reach the Cloudflare secrets.
    if: >-
      github.repository == 'PSU3D0/formualizer' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: docs-site-deploy
      cancel-in-progress: false
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Download static export
        uses: actions/download-artifact@v7
        with:
          name: docs-site-out
          path: docs-site/out

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      # The account id is also in wrangler.jsonc; the secret only overrides it.
      - name: Deploy with wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID_SECRET: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_VERSION: 4.147.0
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set"
            exit 1
          fi
          if [[ -n "${ACCOUNT_ID_SECRET}" ]]; then
            export CLOUDFLARE_ACCOUNT_ID="${ACCOUNT_ID_SECRET}"
          fi
          npx --yes "wrangler@${WRANGLER_VERSION}" deploy

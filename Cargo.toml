[workspace]
resolver = "2"

members = [
  "crates/formualizer-common",
  "crates/formualizer-parse",
  "crates/formualizer-eval",
  "crates/formualizer-macros",
  "crates/formualizer-workbook",
  "crates/formualizer-cli",
  "crates/formualizer-cffi",
  "bindings/python",
  "bindings/wasm",
  "crates/sheetport-spec",
  "crates/formualizer-sheetport",
  "crates/formualizer",
  "crates/formualizer-bench-core",
  "crates/formualizer-testkit",
  "crates/xtask",
]

[workspace.package]
homepage = "https://github.com/psu3d0/formualizer"
license = "MIT OR Apache-2.0"
repository = "https://github.com/psu3d0/formualizer"
documentation = "https://docs.rs/formualizer"


[workspace.dependencies]

formualizer-common = { version = "4.3.0", path = "crates/formualizer-common" }
formualizer-macros = { version = "0.16.0", path = "crates/formualizer-macros" }
formualizer-parse = { version = "4.3.0", path = "crates/formualizer-parse" }
formualizer-eval = { version = "0.16.0", path = "crates/formualizer-eval" }
formualizer-workbook = { version = "0.16.0", path = "crates/formualizer-workbook" }

chrono = { version = "0.4.45", default-features = false, features = ["std"] }
serde = "1.0.228"
serde_json = { version = "1.0.149", features = ["float_roundtrip"] }
serde_yaml = "0.9.34"
schemars = "1.0.4"
semver = "1.0.26"
regex = "1.12.3"
clap = "4.5.57"
anyhow = "1.0.104"
thiserror = "2.0.21"
smallvec = "1.15.1"
rustc-hash = "2.1"
tempfile = "3.25"
web-time = "1.1.0"
pyo3 = "0.30.1"
wasm-bindgen = "0.2.130"
js-sys = "0.3.107"
syn = "2.0"

# Panic-free lint policy. Crates opt in with `[lints] workspace = true` once
# their library code is clean; exceptions are `#[expect(.., reason = "..")]`.
[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
string_slice = "deny"
get_unwrap = "deny"
unwrap_in_result = "deny"
indexing_slicing = "deny"
arithmetic_side_effects = "deny"
allow_attributes_without_reason = "deny"
allow_attributes = "deny"

[profile.release]
codegen-units = 1
lto = true

[patch.crates-io]
umya-spreadsheet = { git = "https://github.com/PSU3D0/umya-spreadsheet.git", rev = "4b64d65daf19bba79800951cd38920d7eb95320c" }
